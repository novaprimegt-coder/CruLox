name: Assemble CRULOX store

on:
  push:
    paths:
      - 'payload/ASSEMBLE'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild exact store file
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part-* > /tmp/crulox-site.b64
          base64 --decode /tmp/crulox-site.b64 > /tmp/crulox-site.gz
          gzip --decompress --stdout /tmp/crulox-site.gz > index.html
          echo '33076c38e7a1456d6c8b66618592ea979957148e450213183fd44a114638925f  index.html' | sha256sum --check --strict

      - name: Publish exact file and clean transfer payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r payload .github/workflows/assemble.yml
          git add index.html
          git commit -m 'Publish CRULOX store exact verified build'
          git push
