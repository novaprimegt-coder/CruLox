name: Assemble CRULOX store

on:
  push:
    paths:
      - 'payload/ASSEMBLE'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild exact store file
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part-* > /tmp/crulox-site.b85
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, hashlib
          encoded = Path('/tmp/crulox-site.b85').read_text()
          compressed = base64.b85decode(encoded.encode('ascii'))
          data = lzma.decompress(compressed, format=lzma.FORMAT_XZ)
          expected = '33076c38e7a1456d6c8b66618592ea979957148e450213183fd44a114638925f'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'SHA-256 mismatch: {actual}')
          Path('index.html').write_bytes(data)
          print(f'Verified exact CRULOX build: {actual}')
          PY

      - name: Publish exact file and clean transfer payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r payload .github/workflows/assemble.yml
          git add index.html
          git commit -m 'Publish CRULOX store exact verified build'
          git push
