name: Fix CRULOX logo only

on:
  push:
    paths:
      - '.github/workflows/fix-crulox-logo.yml'

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace only the visible brand logo references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('index.html')
          data=p.read_bytes()
          old_sha=hashlib.sha256(data).hexdigest()
          expected_old='33076c38e7a1456d6c8b66618592ea979957148e450213183fd44a114638925f'
          if old_sha != expected_old:
              raise SystemExit(f'Unexpected source SHA-256: {old_sha}')
          text=data.decode('utf-8')
          old="if(img.getAttribute('src')!==BRAND_LOGO)img.src=BRAND_LOGO;"
          new="if(img.getAttribute('src')!==BRAND_LOGO_FULL)img.src=BRAND_LOGO_FULL;"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one global logo reference, found {text.count(old)}')
          text=text.replace(old,new,1)
          pattern=r"const CRUZCLICK_SYMBOL_V371='data:image/webp;base64,[^']+';"
          text,n=re.subn(pattern,"const CRUZCLICK_SYMBOL_V371=BRAND_LOGO_FULL;",text,count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one header/hero symbol override, found {n}')
          p.write_text(text,encoding='utf-8')
          new_sha=hashlib.sha256(p.read_bytes()).hexdigest()
          expected_new='c26568c883755e66ceb21a6194ca34c66c841d4b6863bb1350fbf0286a59ef9e'
          if new_sha != expected_new:
              raise SystemExit(f'Unexpected resulting SHA-256: {new_sha}')
          print('Logo-only patch verified:', new_sha)
          PY

      - name: Commit exact logo-only correction and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-crulox-logo.yml
          git add index.html
          git diff --cached --check
          git commit -m 'Replace visible CRULOX symbol with official full logo'
          git push
