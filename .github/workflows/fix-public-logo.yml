name: Fix public CRULOX logo

on:
  push:
    paths:
      - '.github/workflows/fix-public-logo.yml'

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Clone current repository with native Git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf work
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work
          cd work
          git checkout main

      - name: Replace only public brand logo overrides
        shell: bash
        run: |
          set -euo pipefail
          cd work
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          old="if(img.getAttribute('src')!==BRAND_LOGO)img.src=BRAND_LOGO;"
          new="if(img.getAttribute('src')!==BRAND_LOGO_FULL)img.src=BRAND_LOGO_FULL;"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 public V3.7.0 logo override, found {count}')
          s=s.replace(old,new,1)

          pattern=r"const CRUZCLICK_SYMBOL_V371='data:image/webp;base64,[^']+';"
          s,n=re.subn(pattern,"const CRUZCLICK_SYMBOL_V371=BRAND_LOGO_FULL;",s,count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly 1 V3.7.2 symbol constant, found {n}')

          if s == original:
              raise SystemExit('No changes made')
          if 'const BRAND_LOGO_FULL=' not in s:
              raise SystemExit('Full CRULOX logo constant missing')

          p.write_text(s,encoding='utf-8')
          print('Logo-only patch applied successfully.')
          PY

      - name: Commit exact logo-only correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-public-logo.yml
          git commit -m 'Use official full CRULOX logo in public store'
          git push origin main
